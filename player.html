<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game player</title><style>*{box-sizing:border-box}body{margin:0;background:#111d2b;color:white;font:15px system-ui,sans-serif}main{padding:12px}h1{font-size:18px;margin:0 0 10px}#stage{position:relative;width:100%;height:470px;max-height:70vh;background:black}#emulator{width:100%;height:100%}#cover{position:absolute;inset:0;display:grid;place-items:center;background:#19283a;text-align:center}#cover[hidden]{display:none}button{font:inherit;padding:12px 20px;border:0;border-radius:7px;background:#efc24f;color:#19283a;cursor:pointer}#status{font-size:13px;min-height:20px}p{line-height:1.5}.keys{font-size:13px;color:#c5d2e4}</style><main><h1 id="title"></h1><div id="stage"><div id="emulator" tabindex="0"></div><div id="cover"><div><button id="start">Start game</button><p>Click Start game, then Enter for the game’s Start button.</p></div></div></div><p class="keys">Enter = Start · F = Select · W A S D = move · J / K = buttons.<br>Use Control Settings to view or change keys. Take a screenshot of your score with your device’s screenshot shortcut.</p><p id="status" role="status">Choose Start game to begin.</p><button id="retry" hidden>Try again</button> <button id="return">Return to lesson</button></main><script src="games.js?v=repair2"></script><script src="repaired-player.js?v=repair2"></script></html>
